name: Report an error
description: A number, label or source on the site looks wrong.
title: 'Error on '
labels: [data-error]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Filled in for you when you use "Report an error" on the site.
      placeholder: https://wherethemoneywent.com/us/ca/berkeley/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: Which figure or label, and what you expected to see.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Where did you see the right number?
      description: A link to the document, and the page or table if you know it.
